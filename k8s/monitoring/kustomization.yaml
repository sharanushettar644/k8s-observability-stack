apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - prometheus-rules.yaml

# Grafana's dashboard sidecar loads every ConfigMap labelled grafana_dashboard=1.
configMapGenerator:
  - name: dashboard-service-red
    files:
      - service-red.json=../../dashboards/service-red.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Services
generatorOptions:
  disableNameSuffixHash: true
