# Values for prometheus-community/kube-prometheus-stack.
# Installs: Prometheus Operator, Prometheus, Alertmanager, Grafana,
# kube-state-metrics, node-exporter and the community dashboards/alerts.

# Short, predictable names: services become kps-prometheus, kps-alertmanager...
fullnameOverride: kps

# kind (and managed control planes like EKS/AKS/GKE) don't expose these
# components for scraping; leaving them on only produces false TargetDown alerts.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors, PodMonitors and PrometheusRules from every
    # namespace, not only the ones labelled for this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 7d
    retentionSize: 8GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
    # Production: give Prometheus a PersistentVolume, e.g.
    # storageSpec:
    #   volumeClaimTemplate:
    #     spec:
    #       accessModes: ["ReadWriteOnce"]
    #       resources: { requests: { storage: 50Gi } }

alertmanager:
  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/alertmanager-slack/
    secrets:
      - alertmanager-slack
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: ["alertname", "namespace", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Watchdog is an always-firing heartbeat; route it to a dead-man's-switch
        # service (e.g. healthchecks.io) in production.
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']
        - receiver: slack-critical
          matchers: ['severity = "critical"']
          repeat_interval: 1h
        - receiver: slack-warnings
          matchers: ['severity = "warning"']
    inhibit_rules:
      # A critical alert silences the matching warning for the same service.
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity = "warning"']
        equal: ["alertname", "namespace", "service"]
    receivers:
      - name: "null"
      - name: slack-critical
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            channel: "#alerts-critical"
            send_resolved: true
            title: '{{ if eq .Status "firing" }}:red_circle:{{ else }}:white_check_mark:{{ end }} {{ .CommonLabels.alertname }} ({{ .Alerts | len }})'
            text: |-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              {{ if .Annotations.runbook_url }}Runbook: {{ .Annotations.runbook_url }}{{ end }}
              {{ end }}
      - name: slack-warnings
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            channel: "#alerts"
            send_resolved: true
            title: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }} {{ .CommonLabels.alertname }} ({{ .Alerts | len }})'
            text: |-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              {{ end }}

grafana:
  # Admin password comes from a Secret created by scripts/install-monitoring.sh.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: browser
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
