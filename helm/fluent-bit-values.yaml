# Values for fluent/fluent-bit: a DaemonSet that tails every container's
# logs, enriches them with Kubernetes metadata and ships them to Elasticsearch.

env:
  - name: ES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: logging-es-elastic-user   # created by ECK for the "logging" cluster
        key: elastic

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

config:
  service: |
    [SERVICE]
        Daemon            Off
        Flush             2
        Log_Level         info
        Parsers_File      /fluent-bit/etc/parsers.conf
        HTTP_Server       On
        HTTP_Listen       0.0.0.0
        HTTP_Port         2020
        Health_Check      On

  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Exclude_Path      /var/log/containers/fluent-bit*.log
        multiline.parser  docker, cri
        Tag               kube.*
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Labels              On
        Annotations         Off

  outputs: |
    [OUTPUT]
        Name                es
        Match               kube.*
        Host                logging-es-http.logging.svc
        Port                9200
        HTTP_User           elastic
        HTTP_Passwd         ${ES_PASSWORD}
        tls                 On
        tls.verify          Off
        Logstash_Format     On
        Logstash_Prefix     k8s-logs
        Suppress_Type_Name  On
        Replace_Dots        On
        Retry_Limit         5
        Trace_Error         On

# Expose Fluent Bit's own metrics to Prometheus. install-logging.sh turns this
# on automatically when the Prometheus Operator CRDs are installed.
serviceMonitor:
  enabled: false
