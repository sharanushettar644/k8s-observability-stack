name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROMETHEUS_VERSION: "3.1.0"
  ALERTMANAGER_VERSION: "0.28.0"

jobs:
  # ---------------------------------------------------------------------------
  # Fast static checks: alert rule unit tests, config validation, security scan
  # ---------------------------------------------------------------------------
  static:
    name: rules, configs & manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install promtool, amtool and kubeconform
        run: |
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          curl -sSL "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool"
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Lint alert and recording rules
        run: promtool check rules prometheus/rules/*.rules.yaml

      - name: Unit-test alert rules
        run: promtool test rules prometheus/tests/*.test.yaml

      - name: PrometheusRule manifest is in sync with the rule files
        run: |
          pip install --quiet pyyaml==6.0.3
          python3 scripts/render-rules.py --check

      - name: Validate Alertmanager config
        run: |
          yq '.alertmanager.config' helm/kube-prometheus-stack-values.yaml > /tmp/alertmanager.yaml
          amtool check-config /tmp/alertmanager.yaml

      - name: Validate dashboards are valid JSON
        run: |
          for f in dashboards/*.json; do python3 -m json.tool "$f" > /dev/null && echo "valid $f"; done

      - name: Validate Kubernetes manifests
        run: |
          for k in k8s/demo-app k8s/monitoring k8s/logging; do
            echo "::group::$k"
            kubectl kustomize "$k" | kubeconform -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

      - name: Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # Metrics pipeline end to end on kind: scrape -> rules -> dashboard -> alert
  # ---------------------------------------------------------------------------
  e2e-metrics:
    name: e2e metrics & alerting (kind)
    needs: [static]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1
        with:
          cluster_name: observability

      - name: Install kube-prometheus-stack, rules and dashboards
        run: bash scripts/install-monitoring.sh

      - name: Deploy demo app
        run: bash scripts/deploy-demo.sh

      - name: Run checks
        run: bash scripts/e2e-metrics.sh

      - name: Publish report
        if: always()
        run: |
          { echo "## Metrics & alerting end-to-end"; echo; cat e2e-metrics-report.md 2>/dev/null || echo "(no report)"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Debug output on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n monitoring get prometheusrules,servicemonitors -A || true
          kubectl -n monitoring logs statefulset/prometheus-kps-prometheus -c prometheus --tail=80 || true

  # ---------------------------------------------------------------------------
  # Logging pipeline end to end on kind: container logs -> Fluent Bit -> ES
  # ---------------------------------------------------------------------------
  e2e-logging:
    name: e2e logging (kind + EFK)
    needs: [static]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1
        with:
          cluster_name: observability

      - name: Install ECK, Elasticsearch, Kibana and Fluent Bit
        run: bash scripts/install-logging.sh

      - name: Deploy demo app
        run: bash scripts/deploy-demo.sh

      - name: Run checks
        run: bash scripts/e2e-logging.sh

      - name: Publish report
        if: always()
        run: |
          { echo "## Logging end-to-end"; echo; cat e2e-logging-report.md 2>/dev/null || echo "(no report)"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Debug output on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n logging get elasticsearch,kibana || true
          kubectl -n logging logs daemonset/fluent-bit --tail=80 || true
